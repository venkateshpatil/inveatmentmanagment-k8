apiVersion: apps/v1
kind: Deployment
metadata:
  name: initialother-backend-deployment
  namespace: initialother
spec:
  replicas: 1
  selector:
    matchLabels:
      app: initialother-backend
  template:
    metadata:
      labels:
        app: initialother-backend
    spec:
      containers:
        - name: initialother-backend
          image: venkateshp40/saikubeimages:backend-latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080

          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "768Mi"
              cpu: "500m"

          # NEW: HTTP liveness probe using Spring Boot Actuator
          livenessProbe:
            httpGet:
              path: /api/v1/actuator/health/liveness
              port: 8080
            initialDelaySeconds: 150
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 5

          # NEW: HTTP readiness probe using Spring Boot Actuator
          readinessProbe:
            httpGet:
              path: /api/v1/actuator/health/readiness
              port: 8080
            initialDelaySeconds: 90
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6

          envFrom:
            - configMapRef:
                name: initialother-backend-config
            - secretRef:
                name: initialother-backend-secret
          env:
            - name: SPRING_RABBITMQ_HOST
              value: initialother-rabbitmq-service

            - name: SPRING_RABBITMQ_PORT
              value: "5672"

            - name: SPRING_RABBITMQ_USERNAME
              valueFrom:
                secretKeyRef:
                  name: initialother-rabbitmq-secret
                  key: RABBITMQ_DEFAULT_USER

            - name: SPRING_RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: initialother-rabbitmq-secret
                  key: RABBITMQ_DEFAULT_PASS

          volumeMounts:
            - name: backend-logs-volume
              mountPath: /logs

      volumes:
        - name: backend-logs-volume
          persistentVolumeClaim:
            claimName: initialother-backend-logs-pvc
