apiVersion: v1
kind: ConfigMap
metadata:
  name: initialother-grafana-dashboard-provider-config
  namespace: initialother
data:
  dashboard-provider.yml: |
    apiVersion: 1

    providers:
      - name: InitialOther Dashboards
        orgId: 1
        folder: InitialOther
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards