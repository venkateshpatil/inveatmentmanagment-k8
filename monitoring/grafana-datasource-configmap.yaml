apiVersion: v1
kind: ConfigMap
metadata:
  name: initialother-grafana-datasource-config
  namespace: initialother
data:
  datasource.yml: |
    apiVersion: 1

    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://initialother-prometheus-service:9090
        isDefault: true
        editable: true