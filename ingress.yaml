apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: initialother-ingress
  namespace: initialother

spec:
  rules:

    # Frontend + Backend
    - host: initialother-ui.local
      http:
        paths:

          - path: /api/v1
            pathType: Prefix
            backend:
              service:
                name: initialother-backend-service
                port:
                  number: 8080

          - path: /
            pathType: Prefix
            backend:
              service:
                name: initialother-frontend-service
                port:
                  number: 80

    # Grafana
    - host: grafana.initialother.local
      http:
        paths:

          - path: /
            pathType: Prefix
            backend:
              service:
                name: initialother-grafana-service
                port:
                  number: 3000

    # Prometheus
    - host: prometheus.initialother.local
      http:
        paths:

          - path: /
            pathType: Prefix
            backend:
              service:
                name: initialother-prometheus-service
                port:
                  number: 9090
